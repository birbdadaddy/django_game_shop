{% extends 'gameapp/base.html' %}
{% block content %}
    <section class="content-section">
        <h2>Game 2: Survival Dash</h2>
        <p id="timer">Time Passed: 0 seconds</p>
        
        <p>Use the left/right arrow keys to move and avoid falling obstacles. Every 15 seconds you survive you earn 10 points!</p>
        <canvas id="gameCanvas" width="400" height="300"></canvas>
    </section>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let player = { x: 180, y: 260, width: 40, height: 40, speed: 10 };
        let obstacles = [];
        let gameTime = 1000000; // 1000 seconds
        let points = 0;
        let pointsInterval = setInterval(() => {
            if (!gameOver) {
            points += 10;
            console.log(`you survived for 15 seconds! Points: ${points}`);
            }
        }, 15000); // Every 15 seconds
        let gameOver = false;

        function drawPlayer(){
            ctx.fillStyle = "#0077ff";
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }
        function drawObstacles(){
            ctx.fillStyle = "#ff3300";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
        }
        function updateObstacles(){
            for (let obs of obstacles) {
                obs.y += obs.speed;
            }
            obstacles = obstacles.filter(obs => obs.y < canvas.height);
        }
        function createObstacle(){
            let width = Math.random() * 100 + 20;
            let x = Math.random() * (canvas.width - width);
            obstacles.push({ x: x, y: -20, width: width, height: 20, speed: Math.random() * 2 + 3 });
        }
        function checkCollision(rect1, rect2){
            return !(rect1.x > rect2.x + rect2.width || 
                     rect1.x + rect1.width < rect2.x ||
                     rect1.y > rect2.y + rect2.height ||
                     rect1.y + rect1.height < rect2.y);
        }
        function updateGame(){
            if (gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlayer();
            drawObstacles();
            updateObstacles();
            for (let obs of obstacles) {
                if (checkCollision(player, obs)) {
                    gameOver = true;
                    clearInterval(obstacleInterval);
                    if (points != 0){
                        alert(`Well done! You survived ${timepassed} seconds. You earned ${points} points.`);
                        sendPoints(points);
                    }
                    else{
                        alert(`Game Over! You only survived ${timepassed} seconds.`);
                        location.reload();
                    }
                    return;
                }
            }
            requestAnimationFrame(updateGame);
        }
        document.addEventListener("keydown", function(e){
            if (e.key === "ArrowLeft" && player.x > 0){
                player.x -= player.speed;
            } else if (e.key === "ArrowRight" && player.x < canvas.width - player.width){
                player.x += player.speed;
            }
        });
        let obstacleInterval = setInterval(createObstacle, 800);
        setTimeout(() => {
            gameOver = true;
            clearInterval(obstacleInterval);
            alert(`Well done! You survived ${gameTime} seconds. You earned ${points} points.`);
            sendPoints(points);
        }, gameTime);
        updateGame();
    </script>
    <script>
        let timerElement = document.getElementById("timer");
        let timepassed = 0; // Initialize to 0

        let timerInterval = setInterval(() => {
        if (!gameOver) {
            timepassed++;
            timerElement.textContent = `Time Passed: ${timepassed} seconds`;
        } else {
            clearInterval(timerInterval);
        }
        }, 1000); // Update every second
    </script>
{% endblock %}
