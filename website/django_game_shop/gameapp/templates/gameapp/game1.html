{% extends 'gameapp/base.html' %}
{% block content %}
    <section class="content-section">
        <h2>Game 1: Word Unscramble Puzzle</h2>
        <p>Unscramble the word:</p>
        <div id="scrambled-word" class="scramble-word"></div>
        <br>
        <input type="text" id="user-guess" placeholder="Type your guess here">
        <button onclick="checkGuess()">Submit</button>
        <p id="result"></p>
    </section>
    <script>
        const words = ["Mystery", "Journey", "Discover", "Wanderer", "Whisper", "Compass", "Artifact", "Twilight", "Phantom", "Miracle", "Adventure", "Enigma", "Odyssey", "Legend", "Treasure", "Eclipse", "Harmony", "Destiny", "Shadow", "Eternity"];
        let selectedWord = "";
        let scrambled = "";
        function scramble(word) {
            let arr = word.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                 const j = Math.floor(Math.random() * (i + 1));
                 [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.join('');
        }
        function newPuzzle(){
            selectedWord = words[Math.floor(Math.random() * words.length)].toLowerCase();
            scrambled = scramble(selectedWord);
            document.getElementById('scrambled-word').innerText = scrambled.toLowerCase();
            document.getElementById('result').innerText = "";
            document.getElementById('user-guess').value = "";
        }
        function checkGuess() {
            const guess = document.getElementById('user-guess').value.toLowerCase();
            if (guess === selectedWord) {
                document.getElementById('result').innerText = "Correct! You earned 5 points.";
                sendPoints(5);
            } else {
                document.getElementById('result').innerText = "Incorrect, try again!";
            }
        }
        newPuzzle();
    </script>
{% endblock %}
