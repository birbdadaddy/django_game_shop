{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Hidden Treasure Quest</title>
    <link rel="stylesheet" type="text/css" href="{% static 'gameapp/styles.css' %}">
    <script>
        // Helper: Send earned points to the server.
        function sendPoints(points) {
            fetch('/add_points/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'points=' + points
            })
            .then(response => response.json())
            .then(data => {
                alert('Your new total is: ' + data.new_points);
                location.reload();
            });
        }
    </script>
</head>
<body>
    <header>
        <h1>The Hidden Treasure Quest</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'game1' %}">Word Puzzle</a>
            <a href="{% url 'game2' %}">Survival Dash</a>
            <a href="{% url 'shop' %}">Shop</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2025 Your Treasure Hunt Adventure</p>
    </footer>
</body>
</html>
